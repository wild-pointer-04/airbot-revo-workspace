# Ego multimodal collector: USB camera(s) + AIRBOT arm + Revo2 hand → LeRobot.

task: airbot_revo2_right
mock: false
# Empty = Data_Collection/data next to this repo.
data_root: null

# 臂状态来源。
#   rosbridge — 默认。采集器跑 Python 3.12，经 websocket 订臂/手话题。
#   ros2      — 同进程 rclpy（Humble/3.10 下 LeRobot 会退化成 JSONL）。
#   local     — --mock 假臂/假手。
state_source: rosbridge   # rosbridge | ros2 | local

ros2:
  arm_topic: /arm/state

hand:
  enabled: true
  side: right
  topic: /revo2_right/revo2_joint_state/joint_states
  tactile_topic: /revo2_right/revo2_joint_state/dynamic_joint_states
  max_age_s: 0.2

dataset:
  repo_id: airbot_revo2_right
  fps: 10
  use_videos: true
  # Empty = <data_root>/lerobot.
  root: null

# 相机务必用 /dev/v4l/by-id/…，不要写 /dev/videoN（插拔后编号会变）。
# 当前外接全局机：LRCP V1080P → video-index0；笔记本内置摄像头不要采。
cameras:
  cam_global:
    type: opencv
    device: /dev/v4l/by-id/usb-LRCP_V1080P_LRCP_V1080P-video-index0
    width: 640
    height: 480
    fps: 30
    enabled: true
  # 右腕相机接上后取消注释，并把 device 改成对应 by-id：
  # cam_right_wrist:
  #   type: opencv
  #   device: /dev/v4l/by-id/<腕部相机>-video-index0
  #   width: 640
  #   height: 480
  #   fps: 30
  #   enabled: true

# VIVE 右踏板 → /teleop/hand_recording；松开自动 save_episode。
recording_gate:
  enabled: true
  topic: /teleop/hand_recording
  max_age_s: 0.5

# host/port 同时供 state_source=rosbridge 与 recording_gate 使用。
# enabled/topic 只管可选的字符串远程指令 /record_cmd。
rosbridge:
  enabled: false
  host: localhost
  port: 9090
  topic: /record_cmd
