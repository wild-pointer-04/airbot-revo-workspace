# Real ARX X5. Source ROS 2 + start X5Controller before using this file.
backend: arx_ros2

ros:
  cmd_topic: /arm_cmd
  status_topic: /arm_status
  node_name: robot_command_layer
  publish_hz: 100
  status_timeout_sec: 2.0

arm:
  enable_gripper: false
  # Stay in END_CONTROL and keep the last TCP. /arm_cmd PROTECT still drops on this arm.
  hold_mode: end_control
  # Small steps at 100 Hz, like the keyboard teleop. Stops joint/end fighting.
  slew_linear: 0.50
  slew_angular: 1.50

logging:
  level: INFO
