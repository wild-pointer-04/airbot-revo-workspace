backend: airbot_sdk
airbot:
  url: localhost
  port: 50051
  can_interface: can0
  joint_count: 6
  enable_eef: false
  publish_hz: 100
  home_joints:
  - 0.000572213320992887
  - 0.0009536888683214784
  - -0.009727626107633114
  - 0.00476844422519207
  - 0.00019073777366429567
  - 0.01125352829694748
  joint_limits:
  - [-3.151, 2.089]
  - [-2.963, 0.181]
  - [-0.094, 3.161]
  - [-3.012, 3.012]
  - [-1.859, 1.859]
  - [-3.017, 3.017]
  home_tolerance: 0.03
  # DEFAULT: linear/rotational 0.2, joint 0.1. FAST is 10/10/1 (too aggressive).
  # Position tracking is acceptable at 1.5. Wrist tracking needs a higher
  # rotational scale and a joint scale above 0.1 or J4/J6 cannot keep up.
  speed_profile: default
  servo_scale_linear: 1.5
  servo_scale_rotational: 3.0
  servo_scale_joint: 0.6
  slew_linear: 1.0
  slew_angular: 4.0
logging:
  level: INFO
