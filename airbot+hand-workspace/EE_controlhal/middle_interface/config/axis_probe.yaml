network:
  listen_ip: "0.0.0.0"
  port: 15000
  timeout_sec: 0.5

teleop:
  controller: "right"
  deadman: "trigger"
  deadman_press_threshold: 0.5
  deadman_release_threshold: 0.3
  require_deadman_release_on_start: true
  gripper: "grip"
  gripper_full_close: 0.85
  position_scale: 1.0
  pause_button: "left_primary"
  home_button: "none"
  head_base: false
  delay_vr_baseline: true
  max_delta_position: 0.30
  max_delta_angle: 1.0

transform:
  vr_space: "unity"
  axis_map:
    x: ["x", 1.0]
    y: ["y", 1.0]
    z: ["z", 1.0]

filter:
  enabled: false

limits:
  enabled: false

workspace:
  enabled: false
  stop_on_exceed: false

robot:
  adapter: "dummy"
  dummy_initial_position: [0.126, 0.0, 0.210]
  dummy_initial_rotation: [0.0, 0.0, 0.0, 1.0]

logging:
  level: "WARNING"
