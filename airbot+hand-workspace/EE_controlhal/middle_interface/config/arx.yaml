network:
  listen_ip: "0.0.0.0"
  port: 15000
  timeout_sec: 0.5

teleop:
  controller: "right"
  deadman: "trigger"
  deadman_press_threshold: 0.5
  deadman_release_threshold: 0.3
  gripper: "grip"
  gripper_full_close: 0.85
  position_scale: 1.0
  pause_button: "left_primary"
  home_button: "right_primary"
  head_base: true
  delay_vr_baseline: true
  max_delta_position: 0.30
  max_delta_angle: 1.0

transform:
  vr_space: "unity"
  axis_map:
    x: ["x", 1.0]
    y: ["y", 1.0]
    z: ["z", 1.0]

filter:
  enabled: false
  position_alpha: 0.25
  rotation_alpha: 0.25

limits:
  enabled: false
  max_linear_velocity: 0.20
  max_angular_velocity: 0.50

workspace:
  enabled: false
  stop_on_exceed: false
  x:
    min: -0.5
    max: 0.5
  y:
    min: -0.5
    max: 0.5
  z:
    min: 0.05
    max: 0.8

robot:
  adapter: "arx"
  command_layer: "../Robot_control_interface/config/arx_ros2.yaml"

logging:
  level: "INFO"
