backend: libsurvive

mock:
  mode: sinusoidal
  update_rate_hz: 90
  playback_speed: 1.0
  trajectory_csv: null
  static:
    x: 0.40
    y: 0.00
    z: 0.50
  sinusoidal:
    x0: 0.40
    y0: 0.00
    z0: 0.50
    ax: 0.05
    by: 0.03
    cz: 0.02
    omega: 1.0
    omega2: 0.7
  dropout:
    enabled: false
    duration_ms: 100
    period_s: 2.0
    serials: []

libsurvive:
  enabled: true
  extra_args:
    - --lighthouse-gen
    - "1"
    - --lighthouse-2-disable
    - --lighthouse-3-disable
    - --ootx-ignore-sync-error
    # Read-only mode: load the good calibration as initial guess but don't
    # overwrite it, so local minima cannot corrupt the file. Captured with
    # 0.1mm static drift and 1.735m baseline on 2026-09-04.
    - --init-configfile
    - libsurvive_calibration.good.json

# Two trackers only: body-worn HMD + handheld controller.
#
# Bind roles to the permanent LHR- serial, never to libsurvive's runtime alias
# (WM0/WM1) — those are handed out in dongle enumeration order, so they swap
# when a tracker is powered off or the dongles are replugged.
#
# Read a tracker's serial with:  python3 scripts/list_devices.py
trackers:
  - logical_name: body_hmd
    role: head
    serial: LHR-CB0CFB64
    enabled: true
    extrinsics: null
  - logical_name: hand_controller
    role: hand
    serial: LHR-15A9EB13
    enabled: true
    extrinsics: null

bench:
  enabled: false
  stale_s: 0.25

logging:
  console_rate_hz: 10
  level: INFO

queue:
  max_size: 1000
