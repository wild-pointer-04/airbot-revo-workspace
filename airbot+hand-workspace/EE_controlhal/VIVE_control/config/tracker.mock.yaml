# Mock-only two-tracker layout for unit tests.
backend: mock

mock:
  mode: sinusoidal
  update_rate_hz: 90
  playback_speed: 1.0

trackers:
  - logical_name: body_hmd
    role: head
    serial: MOCK-HEAD-001
    enabled: true
  - logical_name: hand_controller
    role: hand
    serial: MOCK-HAND-001
    enabled: true

bench:
  enabled: false
  stale_s: 0.25

logging:
  level: INFO

queue:
  max_size: 100
