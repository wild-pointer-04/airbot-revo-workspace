services:
  airbot-revo:
    image: airbot-revo:humble
    build:
      context: .
      dockerfile: Dockerfile.combined
    container_name: airbot-revo-humble
    hostname: airbot-revo
    # MANUS HIDAPIBridge needs write access to the USB device node.
    user: "0:0"
    network_mode: host
    privileged: true
    ipc: host
    pid: host
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
      - SYS_MODULE
    stdin_open: true
    tty: true
    working_dir: /home/dt/manus-Revo2-Revo3
    environment:
      DISPLAY: ${DISPLAY:-:1}
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: "100"
      ROS_DISTRO: humble
      HOME: /root
      USER: root
      AIRBOT_WORKSPACE: /home/ubuntu/airbot+hand-workspace
      AIRBOT_RUNTIME_IMAGE: registry.cn-shanghai.aliyuncs.com/discover-robotics/airbot-runtime:5.1.6
    volumes:
      - /home/ubuntu/airbot-revo-workspace/manus-Revo2-Revo3:/home/dt/manus-Revo2-Revo3
      - /home/ubuntu/airbot-revo-workspace/airbot+hand-workspace:/home/ubuntu/airbot+hand-workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /sys:/sys:ro
    command: sleep infinity
