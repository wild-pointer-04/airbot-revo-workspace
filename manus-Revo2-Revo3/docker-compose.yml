services:
  manus-revo:
    image: manus-revo:humble
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: dt
        USER_UID: 1000
        USER_GID: 1000
    container_name: manus-revo-humble
    hostname: manus-revo
    # MANUS HIDAPIBridge needs write access to the USB device node (host node is root:root 0664).
    user: "0:0"
    network_mode: host
    privileged: true
    ipc: host
    stdin_open: true
    tty: true
    working_dir: /home/dt/manus-Revo2-Revo3
    environment:
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: "100"
      ROS_DISTRO: humble
    volumes:
      - /home/ubuntu/manus-Revo2-Revo3:/home/dt/manus-Revo2-Revo3
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /sys:/sys:ro
    command: sleep infinity
