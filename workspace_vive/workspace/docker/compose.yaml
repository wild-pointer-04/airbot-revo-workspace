services:
  airbot_workspace:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        USER: dt
        UID: "1000"
        GID: "1000"
        DOCKER_GID: "126"
    image: airbot-hand-workspace:jazzy
    container_name: airbot-hand-workspace
    user: "1000:1000"
    group_add:
      - "126"
      - "20"
      - "44"
    network_mode: host
    privileged: true
    ipc: host
    pid: host
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
      - SYS_MODULE
    stdin_open: true
    tty: true
    working_dir: /home/dt/manus-Revo2-Revo3/airbot+hand-workspace
    volumes:
      - /home/dt/manus-Revo2-Revo3:/home/dt/manus-Revo2-Revo3
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /sys:/sys:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
    environment:
      HOME: /home/dt
      USER: dt
      DISPLAY: ${DISPLAY:-:1}
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      AIRBOT_WORKSPACE: /home/dt/manus-Revo2-Revo3/airbot+hand-workspace
      AIRBOT_RUNTIME_IMAGE: registry.cn-shanghai.aliyuncs.com/discover-robotics/airbot-runtime:5.1.6
    command: sleep infinity
