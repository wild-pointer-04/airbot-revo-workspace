# VIVE teleop → same middle_interface pipeline as PICO.
source: vive

vive:
  tracker_config: config/tracker.yaml
  head: body_hmd
  hand: hand_controller
  timeout_sec: 0.5
  rate_hz: 60

network:
  timeout_sec: 0.5

teleop:
  controller: "right"
  deadman: "trigger"
  deadman_press_threshold: 0.5
  deadman_release_threshold: 0.3
  require_deadman_release_on_start: true
  gripper: "grip"
  gripper_full_close: 0.85
  position_scale: 1.0
  pause_button: "left_primary"
  home_button: "right_primary"
  # Body tracker = HMD heading; hand tracker is relative to that yaw.
  head_base: true
  delay_vr_baseline: true
  max_delta_position: 0.0
  max_delta_angle: 0.0

# libsurvive / SteamVR is OpenXR Stage: +X right, +Y up, -Z forward.
# After vr_normalize + head_base: teleop_standard is body-relative: +X forward, +Y left, +Z up
# Identity mapping because teleop_standard already matches robot frame convention
transform:
  vr_space: steamvr
  axis_map:
    x: ["x", 1.0]   # robot forward ← teleop forward
    y: ["y", 1.0]   # robot left ← teleop left
    z: ["z", 1.0]   # robot up ← teleop up

filter:
  enabled: true
  position_alpha: 0.25
  rotation_alpha: 0.25

limits:
  enabled: false
  max_linear_velocity: 0.20
  max_angular_velocity: 0.15

workspace:
  enabled: false
  stop_on_exceed: false

robot:
  adapter: "command_layer"
  command_layer: "../Robot_control_interface/config/airbot_sdk.yaml"
  dummy_initial_position: [0.30, 0.0, 0.20]
  dummy_initial_rotation: [0.0, 0.0, 0.0, 1.0]

arm_state:
  enabled: true
  topic: /arm/state
  hz: 50

logging:
  level: "INFO"
