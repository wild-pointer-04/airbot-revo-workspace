backend: libsurvive

mock:
  mode: sinusoidal
  update_rate_hz: 90
  playback_speed: 1.0
  trajectory_csv: null
  static:
    x: 0.40
    y: 0.00
    z: 0.50
  sinusoidal:
    x0: 0.40
    y0: 0.00
    z0: 0.50
    ax: 0.05
    by: 0.03
    cz: 0.02
    omega: 1.0
    omega2: 0.7
  dropout:
    enabled: false
    duration_ms: 100
    period_s: 2.0
    serials: []

libsurvive:
  enabled: true
  # This machine's libsurvive/pysurvive was built with USE_DOUBLE.  The ctypes
  # fallback checks this against the loaded shared library before reading poses.
  # Change to "float" only when the installed libsurvive is built without it.
  ctypes_scalar: double
  extra_args:
    - --lighthouse-gen
    - "1"
    - --lighthouse-2-disable
    - --lighthouse-3-disable
    - --ootx-ignore-sync-error
    - --poser
    - MPFIT
    - --disambiguator
    - StateBased
    - --configfile
    - libsurvive_calibration.json
    # Keep the saved base-station geometry fixed while teleoperation and the
    # body-mount calibration are running.  `--use-calibration` is not a
    # libsurvive option in the installed version; its real switch is this one.
    - --disable-calibrate
    - --no-imu

# Two trackers only. body_hmd is the vertically mounted waist tracker; it is
# named for the shared two-tracker packet schema, not an actual HMD.
# LHR serials are stable libsurvive identifiers; do not replace them with WMn
# runtime aliases.
trackers:
  - logical_name: body_hmd
    role: head
    serial: LHR-CB0CFB64
    enabled: true
    extrinsics: null
  - logical_name: hand_controller
    role: hand
    serial: LHR-15A9EB13
    enabled: true
    extrinsics: null

bench:
  enabled: false
  stale_s: 0.25

logging:
  console_rate_hz: 10
  level: INFO

queue:
  max_size: 1000
