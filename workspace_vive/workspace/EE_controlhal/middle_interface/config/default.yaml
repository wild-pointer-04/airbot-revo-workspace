network:
  listen_ip: "0.0.0.0"
  port: 15000
  timeout_sec: 0.5

# Index trigger = deadman. Side grip = gripper. Matches the Quest teleop stack.
teleop:
  controller: "right"
  deadman: "trigger"
  deadman_press_threshold: 0.5
  deadman_release_threshold: 0.3
  gripper: "grip"
  gripper_full_close: 0.85
  position_scale: 1.0
  pause_button: "left_primary"
  # PICO 4 右手 A = right_primary。回官方 go_home_position（当前六轴 0 位）。
  home_button: "right_primary"
  head_base: true
  delay_vr_baseline: true
  max_delta_position: 0.30
  max_delta_angle: 1.0

# vr_space remaps device axes into teleop_standard (+X forward, +Y left, +Z up).
# axis_map is teleop_to_command (HAL spec). Keep identity while dummy / base ≈ standard.
transform:
  vr_space: "unity"
  axis_map:
    x: ["x", 1.0]
    y: ["y", 1.0]
    z: ["z", 1.0]

# Smooth hand_rel (after head-base). Off by default; world-frame filtering smears turns.
filter:
  enabled: false
  position_alpha: 0.25
  rotation_alpha: 0.25

# Per-session Δp/Δq clamps live under teleop. Do not rate-limit the follow path.
limits:
  enabled: false
  max_linear_velocity: 0.20
  max_angular_velocity: 0.50

# Example numbers only. Must be retuned for a real arm before hardware use.
workspace:
  enabled: false
  stop_on_exceed: false
  x:
    min: -0.5
    max: 0.5
  y:
    min: -0.5
    max: 0.5
  z:
    min: 0.05
    max: 0.8

# Default MUST stay dummy. A real adapter is only used after an explicit config change.
robot:
  adapter: "dummy"
  dummy_initial_position: [0.30, 0.0, 0.20]
  dummy_initial_rotation: [0.0, 0.0, 0.0, 1.0]

arm_state:
  enabled: true
  topic: /arm/state
  hz: 50

logging:
  level: "INFO"
