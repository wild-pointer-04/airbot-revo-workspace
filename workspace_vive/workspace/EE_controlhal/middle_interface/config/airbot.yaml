network:
  listen_ip: "0.0.0.0"
  port: 15000
  timeout_sec: 0.5

teleop:
  controller: "right"
  deadman: "trigger"
  deadman_press_threshold: 0.5
  deadman_release_threshold: 0.3
  require_deadman_release_on_start: true
  gripper: "grip"
  gripper_full_close: 0.85
  position_scale: 1.0
  pause_button: "left_primary"
  # PICO right-controller A button returns to configured AIRBOT home_joints.
  home_button: "right_primary"
  # The headset is worn around the neck. Do not rotate commands with HMD yaw.
  head_base: false
  delay_vr_baseline: true
  # Zero disables the per-clutch travel clamp. Releasing the trigger still
  # holds the arm; pressing it again captures a new relative-pose reference.
  max_delta_position: 0.0
  max_delta_angle: 0.0

transform:
  vr_space: "unity"
  axis_map:
    x: ["x", 1.0]
    y: ["y", 1.0]
    z: ["z", 1.0]

filter:
  enabled: true
  position_alpha: 0.25
  rotation_alpha: 0.25

limits:
  # Disabled for direct end_link flange following. The AIRBOT backend still
  # applies its lower-level slew limits from Robot_control_interface/config.
  enabled: false
  max_linear_velocity: 0.20
  max_angular_velocity: 0.15

workspace:
  # The initial 5 cm commissioning box is disabled. AIRBOT collision/joint
  # protection, velocity limiting and per-clutch delta limiting remain active.
  enabled: false
  stop_on_exceed: false
  x: {min: 0.10, max: 0.15}
  y: {min: -0.025, max: 0.025}
  z: {min: 0.185, max: 0.235}

robot:
  adapter: "command_layer"
  command_layer: "../Robot_control_interface/config/airbot_sdk.yaml"

logging:
  level: "INFO"

recording:
  enabled: true
  directory: "logs"
