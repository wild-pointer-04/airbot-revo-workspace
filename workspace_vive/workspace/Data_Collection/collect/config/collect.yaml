# Ego multimodal collector
# 相机本地读；机械臂关节角 / 末端由 ROS2 /arm/state 进入后落盘。

task: pick_cup
mock: false
data_root: /home/dt/manus-Revo2-Revo3/airbot+hand-workspace/Data_Collection/data

# mock=true 时走本地假臂状态。真机默认订 ROS2（由 VIVE/PICO 遥操发布）。
state_source: ros2   # ros2 | local

ros2:
  arm_topic: /arm/state

dataset:
  repo_id: pick_cup
  fps: 10
  use_videos: true
  root: /home/dt/manus-Revo2-Revo3/airbot+hand-workspace/Data_Collection/data/lerobot

cameras:
  cam_right_wrist:
    serial_number: "130322270281"   # D405
    width: 640
    height: 480
    fps: 30
    enable_depth: false

rosbridge:
  enabled: false
  host: localhost
  port: 9090
  topic: /record_cmd
